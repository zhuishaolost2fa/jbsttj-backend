[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info
pidfile=/var/run/supervisord.pid

; ---- HTTP API（uvicorn）----
; Railway 会自动注入 PORT；本地无 PORT 时回退 8000
[program:web]
command=sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

; ---- 4 个 Celery worker，各自独占一个队列 ----
; 免费档内存偏紧，默认并发都压低（extract/chunk=1，qa/embed=2）；
; 需要吞吐时把 -c 调大，或把 worker 拆成独立服务横向扩展。
[program:worker_extract]
; --max-memory-per-child 是安全闸：268MB 扫描件 PDF 跑逐页 OCR 时内存会膨胀，
; 不设的话会被内核 OOM Killer 直接 SIGKILL（连 web 一起带走）；
; 设了之后 Celery 在子进程逼近阈值时自己回收重启，只让该任务重排，服务不雪崩。
; 注意：这只是保活，真正要让大扫描件跑完还得降 ocr_dpi / 缩小分片 / 给 extract worker 更多内存。
command=celery -A app.tasks worker -Q dm.extract -c 1 --max-memory-per-child=300 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:worker_chunk]
command=celery -A app.tasks worker -Q dm.chunk -c 1 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:worker_qa]
command=celery -A app.tasks worker -Q dm.qa -c 2 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:worker_embed]
command=celery -A app.tasks worker -Q dm.embed -c 2 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
