[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
loglevel=info
pidfile=/var/run/supervisord.pid

; ---- HTTP API（uvicorn）----
; Railway 会自动注入 PORT；本地无 PORT 时回退 8000
[program:web]
command=sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

; ---- 单个 Celery worker（threads 池），消费全部队列 ----
; Railway 免费档每服务仅 0.5~1GB RAM：4 个 prefork worker = 13 个进程、
; 常驻约 1.3GB，必然 OOM。合并为 1 个 threads worker（web+worker 共 2 进程，
; 约 450MB），内存砍 2/3 且并发不牺牲：
;   - qa/embed 是 HTTP IO 密集，线程 + llm_max_concurrency=4 信号量限流即可；
;   - extract 的 PyMuPDF 是 C 扩展会释放 GIL，线程同样能并行；
;   - prefetch=1（config 全局生效），4 条队列间不会互相饿死。
; 注意 threads 池的取舍：
;   - --max-memory-per-child 是 prefork 专用，threads 下不生效，
;     大扫描件 OCR 内存膨胀改由「降 ocr_dpi / 缩小分片」兜底；
;   - 不再需要 worker_process_init 重置连接池（同进程内共享单例即可）。
[program:worker]
command=celery -A app.tasks worker -Q dm.extract,dm.chunk,dm.qa,dm.embed,default --pool=threads --concurrency=8 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
