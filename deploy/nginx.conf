# 前端 H5 静态托管 + API 同源反代
#
# 为什么要这一层：
#   - 前端页面和接口都从 80 出来 → 同源，既没有 CORS 预检，也没有 HTTPS/HTTP 混合内容拦截
#   - 前端不需要知道后端真实地址，浏览器只跟 Nginx 打交道
#   - 静态资源走本地磁盘，不经过 Vercel 海外 CDN
#
# 目录约定（服务器上 /opt/jbs/ 下）：
#   /opt/jbs/nginx.conf          本文件
#   /opt/jbs/frontend/           Taro H5 build 产物（本项目 outputRoot 是 dist，
#                                即 dist/ 里的东西直接放这一层，不是 dist/h5/）
#   /opt/jbs/docker-compose.prod.yml
#
# 端口为什么是 80：轻量机防火墙模板默认已放行 80。「未备案拦截」按 HTTP Host 头
# 识别域名，纯 IP 访问不受影响（2026-09-08 实测 http://<IP>/ready 公网可达）。
# 将来绑未备案域名到 80 会被拦，届时需备案或改回高位端口。

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 性能相关 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 文本类资源压缩，H5 首屏主要省在这
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # 上传大 PDF 用，别把 200MB 的文件挡在外面
    client_max_body_size 256m;

    upstream jbs_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 带 hash 的构建产物可以长缓存；index.html 必须不缓存否则发版不生效
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---- 后端接口 ----
        # 注意：这几条必须写在 SPA fallback 之前，否则 /api/xxx 会被回落到 index.html
        location /api/ {
            proxy_pass http://jbs_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # DM 导入是长任务，读超时给足
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 健康检查 / 接口文档也归后端
        location ~ ^/(ready|health|docs|redoc|openapi\.json) {
            proxy_pass http://jbs_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # ---- SPA fallback ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
