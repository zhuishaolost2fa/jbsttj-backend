name: Build & Push to Aliyun ACR (CN)

# 为什么要绕这一圈：
# 境内服务器直接 docker pull 官方镜像已经不可靠 —— Docker Hub 加速生态在
# 2024-2025 洗牌后，网易/中科大等公共源陆续停服，阿里云也公告过镜像加速对
# 海外源可能失败。这里改为：GitHub Actions 在海外机房构建（拉 Docker Hub 顺畅），
# 推到阿里云 ACR 个人版（免费、国内内网/公网都快），服务器只从 ACR 拉。
#
# 配置：仓库 Settings → Secrets 里加 4 个
#   ACR_REGISTRY   registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  你的命名空间（小写）
#   ACR_USERNAME   阿里云账号（或 RAM 子账号）
#   ACR_PASSWORD   ACR 独立密码（不是阿里云登录密码）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签"
        required: false
        default: "latest"
  # 供 deploy-cn.yml 复用（secrets: inherit），避免两处重复维护构建逻辑
  workflow_call:
  push:
    tags:
      - "v*"

env:
  TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 海外构建，pypi 直连即可，不用换源
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/jbsttj-backend:${{ env.TAG }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/jbsttj-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 基础镜像也同步一份到 ACR，服务器就不必碰 Docker Hub
      - name: Mirror redis + rabbitmq to ACR
        run: |
          set -e
          REG="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}"
          mirror() {
            docker pull "$1"
            docker tag  "$1" "$REG/$2:$TAG"
            docker push "$REG/$2:$TAG"
          }
          mirror redis:7-alpine                redis
          mirror rabbitmq:3.13-management-alpine rabbitmq

      - name: Summary
        run: |
          REG="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}"
          echo "后端镜像: $REG/jbsttj-backend:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "Redis:     $REG/redis:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "RabbitMQ:  $REG/rabbitmq:$TAG" >> $GITHUB_STEP_SUMMARY
